# Ежедневный сбор данных. 20:30 UTC = 23:30 МСК. Можно запустить вручную (Actions → Collect → Run workflow)
# или кнопкой «Обновить сейчас» в админке.
name: Collect

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          IG_SESSION_ID: ${{ secrets.IG_SESSION_ID }}
